name: Refresh dashboard
on:
  schedule:
    - cron: "*/10 * * * *"     # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch: {}          # "Run workflow" button for an instant refresh
  push:
    branches: [main]             # rebuild immediately when config.yaml changes
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
