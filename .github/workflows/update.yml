name: Refresh dashboard
on:
  workflow_dispatch: {}          # started every 10 minutes by the Cloudflare Worker's cron, or by hand
  push:
    branches: [main]             # rebuild immediately when config.yaml changes
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      - run: python lab/render.py      # Momentum lab page, from the committed lab/*.csv (no network)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v5
