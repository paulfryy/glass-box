name: Refresh dashboard
on:
  workflow_dispatch: {}          # started every 10 minutes by the Cloudflare Worker's cron, or by hand
  push:
    branches: [main]             # rebuild immediately when config.yaml changes
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # if the coin page can't be built, keep the live one so the lab pages still deploy; the run is marked failed at the end
      - id: build
        run: python build.py
        continue-on-error: true
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      - if: steps.build.outcome == 'failure'
        run: |
          echo "::warning::coin page build failed; re-using the live coin page"
          mkdir -p public && curl -fsS https://glassbox.gripe/ -o public/index.html
      - run: python lab/render.py      # Momentum lab page, from the committed lab/*.csv (no network)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      # GitHub's Pages API occasionally fails to find a just-uploaded artifact: wait and try once more
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - if: steps.build.outcome == 'failure'
        run: |
          echo "::error::the coin page build failed (the lab pages were still deployed); see the 'build' step above"
          exit 1
