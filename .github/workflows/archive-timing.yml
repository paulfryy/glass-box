name: Observe M1 archive timing
on:
  schedule:
    - cron: '7,22,37,52 6-16 20-30 11 *'
    - cron: '7,22,37,52 6-16 1-3 12 *'
    - cron: '7 22 20-30 11 *'
    - cron: '7 22 1-3 12 *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: m1-archive-timing

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      finished: ${{ steps.timing.outputs.finished }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: source
      - uses: actions/checkout@v7
        with:
          ref: m1-archive-timing
          path: observations
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: timing
        run: python source/lab/archive_timing.py --closes source/lab/data/closes.csv --output observations/archive-timing
      - name: Save observations
        working-directory: observations
        run: |
          if [ ! -d archive-timing ]; then exit 0; fi
          git add -- archive-timing
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=glassbox-lab -c user.email=glassbox-lab@users.noreply.github.com commit -m "Record Binance archive timing"
          git push origin HEAD:m1-archive-timing

  finish:
    needs: observe
    if: needs.observe.outputs.finished == 'true'
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Stop the completed experiment
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/archive-timing.yml/disable"
