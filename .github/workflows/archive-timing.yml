name: Observe M1 archive timing
on:
  workflow_call:
    outputs:
      ready:
        description: The full candle set is visible and the Lab has an older close.
        value: ${{ jobs.observe.outputs.ready }}
  workflow_dispatch:

permissions: {}

concurrency:
  group: m1-archive-timing

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.timing.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: source
          ref: main
      - uses: actions/checkout@v7
        with:
          ref: m1-archive-timing
          path: observations
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: timing
        run: >-
          python source/lab/archive_timing.py
          --closes source/lab/data/closes.csv --status source/lab/status.txt
          --output observations/archive-timing
      - name: Save observations
        working-directory: observations
        run: |
          if [ ! -d archive-timing ]; then exit 0; fi
          git add -- archive-timing
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=glassbox-lab -c user.email=glassbox-lab@users.noreply.github.com commit -m "Record Binance archive timing"
          git push origin HEAD:m1-archive-timing
