name: Update Strategy Lab
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: strategy-lab-data

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r lab/requirements.txt
      - run: python -m unittest discover -s lab -p 'test_*.py'
      - run: python lab/m1.py
      - run: python lab/carry.py
      - run: python lab/seesaw.py
      - run: python lab/verify.py --base HEAD
      - run: python lab/proof.py
      - name: Commit updated lab records
        run: |
          git config user.name "glassbox-lab"
          git config user.email "glassbox-lab@users.noreply.github.com"
          git add lab/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Strategy Lab: data through $(grep '^data_through=' lab/status.txt | cut -d= -f2)"
          git pull --rebase
          git push

  publish:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-lab.yml
