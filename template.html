<title>Glass Box Coin</title>
<meta name="description" content="Live on-chain transparency dashboard: holders, trades, creator position and red-flag checks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#15201D; --muted:#5A6B66; --line:#D5DEDA;
  --accent:#0B7A6E; --accent-soft:#DDEFEB; --pass:#2F8F5B; --pass-soft:#E1F2E8;
  --fail:#C0392B; --fail-soft:#F8E1DE; --warn:#B86E12; --warn-soft:#F7EAD6;
  --bar:#E4EBE8;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1614; --surface:#15201D; --ink:#E4ECE9; --muted:#9AAAA5; --line:#2A3833;
    --accent:#3CC2B0; --accent-soft:#143530; --pass:#5CC98B; --pass-soft:#16301F;
    --fail:#F07A6C; --fail-soft:#3A1B17; --warn:#E3A24B; --warn-soft:#3A2A12; --bar:#22302C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1614; --surface:#15201D; --ink:#E4ECE9; --muted:#9AAAA5; --line:#2A3833;
  --accent:#3CC2B0; --accent-soft:#143530; --pass:#5CC98B; --pass-soft:#16301F;
  --fail:#F07A6C; --fail-soft:#3A1B17; --warn:#E3A24B; --warn-soft:#3A2A12; --bar:#22302C;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:28px 56px;display:grid;gap:28px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(28px,5vw,40px);font-weight:700;line-height:1.05}
h2{font-size:20px;font-weight:600}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.coinimg{width:96px;height:96px;border-radius:14px;border:1px solid var(--line);background:var(--surface);object-fit:cover}
.head p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
.addr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.addr code{font-family:var(--mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);padding:4px 8px;border-radius:6px;word-break:break-all}
button.copy{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:6px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer}
.promise{border-left:3px solid var(--accent);padding:10px 14px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px;max-width:80ch}

/* summary */
.progress{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;gap:12px}
.pbar{position:relative;height:16px;background:var(--bar);border-radius:8px;overflow:hidden}
.pfill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:8px;min-width:3px}
.pscale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--muted)}

/* flags */
.flags{display:grid;gap:8px}
.flag{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.flag .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
.flag.ok .dot{background:var(--pass-soft);color:var(--pass)}
.flag.bad .dot{background:var(--fail-soft);color:var(--fail)}
.flag .d{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right}
.flag.bad{border-color:var(--fail)}
.score{font-family:var(--display);font-size:15px;font-weight:600}

/* tables */
.two{display:grid;grid-template-columns:1fr 1.25fr;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;white-space:nowrap}
.tag.creator{background:var(--accent-soft);color:var(--accent)}
.tag.sniper{background:var(--warn-soft);color:var(--warn)}
.buy{color:var(--pass);font-weight:600}.sell{color:var(--fail);font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:8px 0}

/* history */
.hist{display:grid;gap:10px}
.att{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.att .n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted)}
.att.current{border-color:var(--accent)}
.att .note{color:var(--muted);font-size:13.5px;margin-top:2px}
.att .st{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.foot{color:var(--muted);font-size:13px;display:grid;gap:4px;max-width:80ch}
@media (max-width:760px){.two{grid-template-columns:1fr}.head{grid-template-columns:1fr}.coinimg{width:80px;height:80px}
  .flag{grid-template-columns:28px 1fr}.flag .d{grid-column:2;text-align:left}.att{grid-template-columns:auto 1fr}.att .st{grid-column:2;text-align:left}}

[hidden]{display:none!important}   /* .wrap{display:grid} would otherwise override the hidden attribute */

/* tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs a{font-family:var(--display);font-weight:600;font-size:15px;text-decoration:none;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* scanner (Check any coin) */
.scan-head{display:grid;gap:8px}
.scan-head p{margin:0;color:var(--muted);max-width:64ch}
.searchbar{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--surface);max-width:760px}
.searchbar:focus-within{border-color:var(--accent)}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:14.5px;padding:14px}
.searchbar input:focus{outline:none}
.searchbar button{border:0;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:600;font-size:16px;padding:0 22px;cursor:pointer;white-space:nowrap}
.searchbar button:disabled{opacity:.6;cursor:wait}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.chips button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.chips .k{font-family:var(--mono);color:var(--muted)}
.scanning{display:grid;gap:10px;max-width:760px}
.scanbar{height:6px;border-radius:3px;background:var(--bar);overflow:hidden}
.scanbar i{display:block;height:100%;width:35%;background:var(--accent);border-radius:3px}
@media (prefers-reduced-motion:no-preference){.scanbar i{animation:sweep 1.1s ease-in-out infinite alternate}}
@keyframes sweep{from{transform:translateX(-10%)}to{transform:translateX(200%)}}

.report{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.report-top{display:grid;grid-template-columns:minmax(220px,300px) 1fr}
.verdict-box{padding:20px;display:grid;gap:10px;align-content:start;border-right:1px solid var(--line)}
.verdict-box .word{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.v-clean .word{color:var(--pass)} .v-mixed .word,.v-caution .word{color:var(--warn)} .v-danger .word{color:var(--fail)}
.v-clean{background:var(--pass-soft)} .v-mixed,.v-caution{background:var(--warn-soft)} .v-danger{background:var(--fail-soft)}
.meter{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.meter span{height:10px;border-radius:2px;background:var(--pass)}
.meter span.m{background:var(--warn)} .meter span.h{background:var(--fail)}
.meter-key{font-size:12px;color:var(--muted)}
.coin-box{padding:20px;display:grid;gap:12px;align-content:start;min-width:0}
.coin-box h2{font-size:24px}
.coin-box .mint{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.coin-box .mint code{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all}
.minibtn{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:6px;padding:3px 9px;cursor:pointer}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.facts div{display:grid;gap:2px}
.facts b{font-family:var(--mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.mini-progress{height:6px;border-radius:3px;background:var(--bar);overflow:hidden;margin-top:4px}
.mini-progress i{display:block;height:100%;background:var(--accent)}
.report-body{border-top:1px solid var(--line);padding:18px 20px;display:grid;gap:16px}
.issue{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.issue:last-child{border-bottom:0}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;align-self:start;margin-top:2px}
.pill.high,.pill.critical{background:var(--fail-soft);color:var(--fail)} .pill.medium{background:var(--warn-soft);color:var(--warn)}
.issue .t{font-weight:600} .issue .w{grid-column:2;color:var(--muted);font-size:13.5px} .issue .dd{grid-column:2;font-family:var(--mono);font-size:12.5px}
.oks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 18px}
.oks div{font-size:13.5px;color:var(--muted)} .oks div::before{content:"✓ ";color:var(--pass);font-weight:700}
details.holders summary{cursor:pointer;font-family:var(--display);font-weight:600}
.fine{font-size:12.5px;color:var(--muted)}
.err{color:var(--fail)}
@media (max-width:760px){.report-top{grid-template-columns:1fr}.verdict-box{border-right:0;border-bottom:1px solid var(--line)}}

@media (prefers-reduced-motion:no-preference){.pfill{transition:width .6s ease}}
</style>

<div class="wrap" style="padding-block:18px 0">
  <nav class="tabs" aria-label="Sections">
    <a href="#coin" id="tabCoin" aria-current="page">This coin</a>
    <a href="#check" id="tabCheck">Check any coin</a>
  </nav>
</div>
<div class="wrap" id="app"></div>
<div class="wrap" id="checker" hidden>
  <section class="scan-head">
    <div class="label">Scanner</div>
    <h1>Check any pump.fun coin</h1>
    <p>Paste a coin's address. We read it live from the Solana blockchain and run the same nine checks this site runs on its own coin. Warning signs, not guarantees.</p>
  </section>
  <form class="searchbar" id="checkForm" autocomplete="off">
    <label for="mintInput" style="position:absolute;left:-9999px">Coin address</label>
    <input id="mintInput" name="mint" placeholder="Paste a coin address, e.g. 7qEZ…pump" spellcheck="false" required>
    <button id="checkBtn" type="submit">Scan</button>
  </form>
  <div class="chips" id="examples">
    <span>Try:</span>
    <button type="button" data-mint="7qEZQvojcBEyWjuzpHVATBA3yoBNpEvx42ELLpuWpump">Glass Box <span class="k">clean</span></button>
    <button type="button" data-mint="D73WxcQ9H7fbvr6tQTmpeMUgD7FTKExMTPkfhuifworm">worm <span class="k">bundled launch</span></button>
    <button type="button" data-mint="3cTzP93QSkBRYt796Ufn3VWPaafE5V9DpXtDVGHMpump">Elon Coin <span class="k">self-graduated</span></button>
  </div>
  <div class="chips" id="recent" hidden></div>
  <div id="checkOut" aria-live="polite"></div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const c = D.current;
  const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const short = a => a ? a.slice(0,4) + '…' + a.slice(-4) : '';
  const pct = (x,d=2) => (x*100).toFixed(d) + '%';
  const sol = (x,d=3) => x.toFixed(d) + ' SOL';
  const when = t => new Date(t*1000).toISOString().replace('T',' ').slice(0,16) + ' UTC';
  const ago = t => { const s = D.generated - t; if (s < 3600) return Math.round(s/60) + ' min'; if (s < 172800) return (s/3600).toFixed(1) + ' h'; return Math.round(s/86400) + ' days'; };
  const solscan = (kind, id) => `https://solscan.io/${kind}/${id}`;
  const passed = c.flags.filter(f => f.ok).length;

  const img = D.image ? `<img class="coinimg" src="${D.image}" alt="${esc(c.name)} coin art">` : '';
  const app = document.getElementById('app');
  app.append(el(`
  <header class="head">
    ${img}
    <div>
      <div class="label">Glass Box Coin · live on-chain dashboard</div>
      <h1>${esc(c.name)} <span class="mono" style="font-size:.55em;color:var(--muted)">$${esc(c.symbol)}</span></h1>
      <p>Every number on this page is read from the public Solana blockchain. Nothing here is self-reported, and every figure has a link you can check yourself.</p>
      <div class="addr"><code id="mint">${esc(c.mint)}</code><button class="copy" id="copyBtn" type="button">Copy address</button>
        <a href="https://pump.fun/coin/${esc(c.mint)}" target="_blank" rel="noopener">pump.fun page</a> ·
        <a href="${solscan('token', c.mint)}" target="_blank" rel="noopener">Solscan</a></div>
      <div class="meta">
        <span class="chip">Created <b>${when(c.created)}</b></span>
        <span class="chip">Age <b>${ago(c.created)}</b></span>
        <span class="chip">Pair <b>${esc(c.quote)}</b></span>
        <span class="chip">Fees go to <b>${esc(c.reward_mode)}</b></span>
        <span class="chip">Status <b>${c.graduated ? 'graduated' : 'on bonding curve'}</b></span>
      </div>
    </div>
  </header>
  <div class="promise"><b>The deal:</b> this is a meme coin, just for fun. No roadmap, no team, no promises about price. The creator's own position is small and shown below, and it will be shown here if it ever changes. Don't buy anything you can't afford to lose.</div>

  <section class="progress" aria-label="Bonding curve progress">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline">
      <h2>Bonding curve</h2><span class="mono">${sol(c.real_sol,3)} of ~85 SOL · ${pct(c.curve_progress,2)}</span>
    </div>
    <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${(c.curve_progress*100).toFixed(1)}"><div class="pfill" style="width:${Math.max(c.curve_progress*100,0.4)}%"></div></div>
    <div class="pscale"><span>0 SOL · launch</span><span>42.5</span><span>85 SOL · graduates to PumpSwap</span></div>
    <div class="stats">
      <div class="stat"><div class="label">Market cap</div><div class="v">${c.mcap_sol.toFixed(1)} SOL</div><div class="s">${c.mcap_usd ? '≈ $' + Math.round(c.mcap_usd).toLocaleString() : ''}</div></div>
      <div class="stat"><div class="label">Holders</div><div class="v">${c.holders}</div><div class="s">wallets holding any</div></div>
      <div class="stat"><div class="label">Outside buyers</div><div class="v">${c.outside_wallets}</div><div class="s">wallets other than the creator</div></div>
      <div class="stat"><div class="label">Volume</div><div class="v">${c.volume_sol.toFixed(3)}</div><div class="s">SOL traded, ${c.trades} trades</div></div>
      <div class="stat"><div class="label">Creator fees</div><div class="v">${c.creator_fees_sol.toFixed(4)}</div><div class="s">SOL earned so far</div></div>
    </div>
  </section>

  <section style="display:grid;gap:12px" aria-label="Red flag checklist">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <h2>Red-flag checklist</h2><span class="score">${passed} of ${c.flags.length} checks pass</span>
    </div>
    <div class="flags">${c.flags.map(f => `
      <div class="flag ${f.ok ? 'ok' : 'bad'}"><span class="dot" aria-hidden="true">${f.ok ? '✓' : '!'}</span>
        <span>${esc(f.check)}<span class="sr" style="position:absolute;left:-9999px">${f.ok ? ' passes' : ' fails'}</span></span>
        <span class="d">${esc(f.detail)}</span></div>`).join('')}</div>
    <div class="foot">These are the warning signs that most often come before a dump on pump.fun, based on our study of ~400,000 launches: active mint or freeze authority, large creator buys, creator selling, bundled launch buying, concentrated holders, instant self-funded graduation, and supply-changing mayhem mode.</div>
  </section>

  <section class="two">
    <div class="panel"><h2>Top holders</h2>
      ${c.top_holders.length ? `<div class="tbl"><table><thead><tr><th>Wallet</th><th></th><th style="text-align:right">Supply</th></tr></thead><tbody>
      ${c.top_holders.map(h => `<tr><td class="mono"><a href="${solscan('account', h.wallet)}" target="_blank" rel="noopener">${short(h.wallet)}</a></td>
        <td>${h.tag ? `<span class="tag ${h.tag === 'creator' ? 'creator' : 'sniper'}">${esc(h.tag)}</span>` : ''}</td><td class="num">${pct(h.pct,3)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="s" style="font-size:12.5px;color:var(--muted)">Top 10 hold ${pct(c.top10_pct,2)} of supply. The rest is still in the bonding curve, unsold.</div>` : '<div class="empty">No holders yet.</div>'}
    </div>
    <div class="panel"><h2>Recent trades</h2>
      ${c.recent_trades.length ? `<div class="tbl"><table><thead><tr><th>Time (UTC)</th><th>Side</th><th style="text-align:right">SOL</th><th>Wallet</th></tr></thead><tbody>
      ${c.recent_trades.map(t => `<tr><td class="mono"><a href="${solscan('tx', t.sig)}" target="_blank" rel="noopener">${when(t.time).slice(5,16)}</a></td>
        <td class="${t.side}">${t.side}</td><td class="num">${t.sol.toFixed(4)}</td>
        <td class="mono">${short(t.wallet)} ${t.tag ? `<span class="tag ${t.tag === 'creator' ? 'creator' : 'sniper'}">${esc(t.tag)}</span>` : ''}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">No trades yet.</div>'}
    </div>
  </section>


  <footer class="foot">
    <div>Updated ${when(D.generated)}, refreshed automatically about every 10 minutes. Holders are rebuilt from bonding-curve trades, so tokens moved between wallets outside a trade aren't counted.</div>
    <div>Anyone can check these numbers: paste the coin address into Solscan or any Solana explorer.</div>
  </footer>`));

  const btn = document.getElementById('copyBtn');
  btn.addEventListener('click', () => {
    const txt = c.mint;
    const done = () => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy address', 1500); };
    try {
      navigator.clipboard.writeText(txt).then(done, () => { selectMint(); });
    } catch (e) { selectMint(); }
  });
  function selectMint(){ const r = document.createRange(); r.selectNodeContents(document.getElementById('mint')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Press Ctrl+C'; }
})();
</script>

<script>
(function(){
  const API = "https://api.glassbox.gripe/check?mint=";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const short = a => a ? a.slice(0,4) + '…' + a.slice(-4) : '';
  const WORD = {clean:'No red flags', mixed:'Some warning signs', caution:'Caution', danger:'High risk'};
  // headline shown when a check FAILS (the check names themselves describe the passing state)
  const FAIL_TITLE = [
    [/^Mint authority/, 'Mint authority is still active'],
    [/^Freeze authority/, 'Freeze authority is still active'],
    [/^Not in mayhem/, 'Coin is in mayhem mode'],
    [/^Creator's launch buy/, 'Creator bought a large share at launch'],
    [/^Creator still holds/, 'Creator has sold their launch buy'],
    [/^Launch buyers took/, 'Launch buyers grabbed a large share'],
    [/^Launch snipers still hold/, 'Launch snipers still hold a large share'],
    [/^Top-10 wallets/, 'A few wallets own a large share'],
    [/^No instant/, 'Graduated instantly, likely self-funded'],
  ];
  const failTitle = c => (FAIL_TITLE.find(([re]) => re.test(c)) || [null, c])[1];
  const age = t => { const s = Date.now()/1000 - t; return s < 3600 ? Math.round(s/60) + ' min' : s < 172800 ? (s/3600).toFixed(1) + ' h' : Math.round(s/86400) + ' days'; };
  let busy = false;

  function show(tab){
    const check = tab === 'check';
    $('app').hidden = check; $('checker').hidden = !check;
    $('tabCoin').removeAttribute('aria-current'); $('tabCheck').removeAttribute('aria-current');
    (check ? $('tabCheck') : $('tabCoin')).setAttribute('aria-current', 'page');
  }
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));

  function recent(add){
    let list = [];
    try { list = JSON.parse(localStorage.getItem('gb_recent') || '[]'); } catch (e) {}
    if (add) {
      list = [add, ...list.filter(x => x.mint !== add.mint)].slice(0, 5);
      try { localStorage.setItem('gb_recent', JSON.stringify(list)); } catch (e) {}
    }
    const box = $('recent');
    box.hidden = !list.length;
    box.innerHTML = list.length ? '<span>Recent:</span>' + list.map(x =>
      `<button type="button" data-mint="${esc(x.mint)}">${esc(x.name)} <span class="k">${esc(WORD[x.verdict] || '')}</span></button>`).join('') : '';
  }

  function report(d){
    const order = {critical: 0, high: 1, medium: 2};
    const fails = d.flags.filter(f => !f.ok).sort((a, b) => order[a.severity] - order[b.severity]);
    const oks = d.flags.filter(f => f.ok);
    const seg = d.flags.map(f => `<span class="${f.ok ? '' : (f.severity === 'medium' ? 'm' : 'h')}" title="${esc(f.check)}"></span>`).join('');
    const share = `${location.origin}${location.pathname}?mint=${encodeURIComponent(d.mint)}#check`;
    const failHtml = fails.length
      ? `<section><h2>What looks wrong</h2>${fails.map(f => `
          <div class="issue"><span class="pill ${f.severity}">${esc(f.severity)}</span><span class="t">${esc(failTitle(f.check))}</span>
            <span class="w">${esc(f.why)}</span><span class="dd">${esc(f.detail)}</span></div>`).join('')}</section>`
      : `<section><h2>Nothing on our list</h2><p class="fine" style="margin:4px 0 0">All nine checks passed. That rules out the obvious risks we look for; it doesn't make a coin a good bet.</p></section>`;
    const okHtml = oks.length
      ? `<section><h2 style="font-size:16px;margin-bottom:8px">Passed</h2><div class="oks">${oks.map(f => `<div>${esc(f.check)}</div>`).join('')}</div></section>` : '';
    const rows = d.topHolders.map(h => `<tr><td class="mono">${h.wallet ? `<a href="https://solscan.io/account/${esc(h.wallet)}" target="_blank" rel="noopener">${short(h.wallet)}</a>` : '–'}</td>
      <td>${h.tag ? `<span class="tag ${h.tag === 'creator' ? 'creator' : 'sniper'}">${esc(h.tag)}</span>` : ''}</td><td class="num">${(h.pct * 100).toFixed(3)}%</td></tr>`).join('');
    return `
    <article class="report">
      <div class="report-top">
        <div class="verdict-box v-${d.verdict}">
          <div class="label">Verdict</div>
          <div class="word">${WORD[d.verdict]}</div>
          <div class="meter" role="img" aria-label="${d.failCount} of ${d.flags.length} checks failed">${seg}</div>
          <div class="meter-key">${d.failCount} of ${d.flags.length} checks failed</div>
        </div>
        <div class="coin-box">
          <div><h2>${esc(d.name)} <span class="mono" style="font-size:.6em;color:var(--muted)">$${esc(d.symbol)}</span></h2>
            <div class="mint"><code>${esc(d.mint)}</code><button class="minibtn" type="button" data-copy="${esc(share)}">Copy share link</button></div></div>
          <div class="facts">
            <div><span class="label">Age</span><b>${d.created ? age(d.created) : '–'}</b></div>
            <div><span class="label">Market cap</span><b>${d.mcapSol.toFixed(1)} SOL</b></div>
            <div><span class="label">Fees go to</span><b>${esc(d.rewardMode)}</b></div>
            <div><span class="label">${d.graduated ? 'Graduated' : 'To graduation'}</span><b>${(d.curveProgress * 100).toFixed(1)}%</b>
              <div class="mini-progress"><i style="width:${Math.max(d.curveProgress * 100, 1)}%"></i></div></div>
          </div>
        </div>
      </div>
      <div class="report-body">
        ${failHtml}
        ${okHtml}
        <details class="holders"><summary>Top holders</summary>
          <div class="tbl" style="margin-top:8px"><table><thead><tr><th>Wallet</th><th></th><th style="text-align:right">Supply</th></tr></thead><tbody>${rows}</tbody></table></div></details>
        <p class="fine" style="margin:0">${esc(d.note)} Verify it yourself: <a href="https://pump.fun/coin/${esc(d.mint)}" target="_blank" rel="noopener">pump.fun</a> · <a href="https://solscan.io/token/${esc(d.mint)}" target="_blank" rel="noopener">Solscan</a>. ${d.cached ? 'Result from the last 5 minutes.' : 'Checked just now.'}</p>
      </div>
    </article>`;
  }

  async function run(mint){
    if (busy) return;
    busy = true;
    const out = $('checkOut'), btn = $('checkBtn');
    $('mintInput').value = mint;
    btn.disabled = true; btn.textContent = 'Scanning…';
    out.innerHTML = '<div class="scanning"><div class="scanbar"><i></i></div><span class="fine">Reading the blockchain: creation, launch buyers, holders, authorities…</span></div>';
    try {
      const r = await fetch(API + encodeURIComponent(mint));
      const d = await r.json();
      if (!d.ok) { out.innerHTML = `<p class="err">${esc(d.error || 'Something went wrong.')}</p>`; return; }
      out.innerHTML = report(d);
      recent({mint: d.mint, name: d.name, verdict: d.verdict});
      try { history.replaceState(null, '', `?mint=${encodeURIComponent(d.mint)}#check`); } catch (e) {}
    } catch (err) {
      out.innerHTML = "<p class=\"err\">Couldn't reach the scanner. Check your connection and try again.</p>";
    } finally {
      busy = false; btn.disabled = false; btn.textContent = 'Scan';
    }
  }

  $('checkForm').addEventListener('submit', e => { e.preventDefault(); run($('mintInput').value.trim()); });
  document.addEventListener('click', e => {
    const b = e.target.closest('button[data-mint]');
    if (b) { run(b.dataset.mint); return; }
    const c = e.target.closest('button[data-copy]');
    if (c) {
      const done = () => { c.textContent = 'Link copied'; setTimeout(() => { c.textContent = 'Copy share link'; }, 1500); };
      try { navigator.clipboard.writeText(c.dataset.copy).then(done, () => {}); } catch (err) {}
    }
  });

  recent();
  const q = new URLSearchParams(location.search).get('mint');
  if (q) { show('check'); run(q); } else { show(location.hash.slice(1)); }
})();
</script>
