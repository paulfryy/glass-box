<title>Momentum Rule · Strategy Lab</title>
<meta name="description" content="A public, pre-registered paper-trading test of one memecoin momentum rule. Positions are published and Bitcoin-timestamped each week; losses stay up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

</style>

<div class="wrap" style="padding-block:18px 0">
  <nav class="tabs" aria-label="Sections">
    <a href="/">This coin</a>
    <a href="/#check">Check any coin</a>
    <a href="/lab/" aria-current="page">Strategy lab</a>

  </nav>

<div class="wrap" id="lab"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const pct = (x, d=1) => (x >= 0 ? '+' : '−') + Math.abs(x * 100).toFixed(d) + '%';
  const cls = x => x > 0 ? 'up' : (x < 0 ? 'down' : '');
  const usd = x => '$' + x.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const usd0 = x => '$' + Math.round(x).toLocaleString('en-US');
  const sgn$ = x => (Math.round(x) >= 0 ? '+' : '−') + '$' + Math.abs(Math.round(x)).toLocaleString('en-US');
  const price = x => x == null ? '–' : (x >= 1 ? x.toFixed(3) : x.toPrecision(4));
  const fmtDate = s => new Date(s + 'T00:00:00Z').toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC'});
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  // times in the visitor's own zone, with UTC alongside
  const localTime = ms => { const d = new Date(ms);
    return `${d.toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short'})} (${d.toISOString().slice(11, 16)} UTC)`; };
  const utcStamp = s => Date.parse(String(s).replace(' ', 'T') + ':00Z');
  const START = '2026-09-28';
  const bank = usd0(D.bankroll);
  const TIP = {
    long: 'Long: a bet that the price rises. Gains when it goes up.',
    short: 'Short: a bet that the price falls. Gains when it goes down, loses when it goes up.',
    funding: 'Funding: a small fee that futures longs and shorts pay each other every few hours.',
  };
  const term = (word, tip) => `<span class="term" title="${esc(tip)}">${word}</span>`;
  // each coin links to TradingView's chart of the exact Binance perpetual the rule uses (exchange pinned)
  const coinLink = c => `<a class="coin" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent('BINANCE:' + c + 'USDT.P')}" target="_blank" rel="noopener" title="Chart of the Binance ${esc(c)} perpetual on TradingView (opens in a new tab)">${esc(c)}</a>`;

  // ---- official account (Binance daily closes)
  const eq = D.equity;
  const last = eq.length ? eq[eq.length - 1] : null;
  const official = last ? last.e : D.bankroll;
  const btcRet = last ? last.b / D.bankroll - 1 : 0;
  let peak = D.bankroll, dd = 0;
  for (const r of eq) { peak = Math.max(peak, r.e); dd = Math.min(dd, r.e / peak - 1); }
  const wk = D.weeks.length ? D.weeks[D.weeks.length - 1] : null;
  // account value at the close that opened this week (position sizes are shares of it)
  const weekBase = !wk || wk === START ? D.bankroll : ((eq.find(r => r.d === wk) || {}).e || official);
  const gross = D.book.reduce((s, p) => s + Math.abs(p.weight), 0);

  // ---- live marks (indicative) from api.glassbox.gripe/prices; fall back to the last daily close
  let live = null;
  const mark = p => { const lp = live && live.prices[p.coin + 'USDT']; return lp ? {px: lp, live: true} : {px: p.now, live: false}; };
  const dir = p => p.side === 'long' ? 1 : -1;
  const pnlWeek = p => { const m = mark(p); return m.px == null ? 0 : Math.abs(p.weight) * weekBase * (m.px / p.entry - 1) * dir(p); };
  // live value = official value at the last close, moved by each position's change since that close
  const liveValue = () => official * (1 + D.book.reduce((s, p) => { const m = mark(p);
    return s + (m.px == null || p.now == null ? 0 : p.weight * (m.px / p.now - 1)); }, 0));

  // ---- chart
  // expected range: bootstrap of the rule's Apr–Sep 2026 out-of-sample days (lab/band.json)
  const B = D.band, nDays = eq.length;
  const bandAt = (k, i) => i === 0 ? 0 : B[k][Math.min(i, B.days) - 1];
  function chart(){
    const end = Math.min(B ? B.days : 182, Math.max(28, Math.ceil((nDays + 7) / 7) * 7));   // show at least 4 weeks ahead
    const pts = [{i: 0, e: D.bankroll, b: D.bankroll}, ...eq.map((r, k) => ({i: k + 1, e: r.e, b: r.b}))];
    const W = 800, H = 260, pl = 60, pr = 12, pt = 12, pb = 28;
    const idx = [...Array(end + 1).keys()];
    const vals = pts.flatMap(p => [p.e, p.b]).concat(B ? idx.flatMap(i => [D.bankroll * (1 + bandAt('p5', i)), D.bankroll * (1 + bandAt('p95', i))]) : []);
    let lo = Math.min(...vals, D.bankroll), hi = Math.max(...vals, D.bankroll);
    const pad = (hi - lo) * 0.06 || 20; lo -= pad; hi += pad;
    const x = i => pl + i * (W - pl - pr) / end;
    const y = v => pt + (hi - v) * (H - pt - pb) / (hi - lo);
    const P = (i, v) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`;
    const area = (a, b) => idx.map(i => P(i, D.bankroll * (1 + bandAt(b, i)))).join(' ') + ' ' + idx.slice().reverse().map(i => P(i, D.bankroll * (1 + bandAt(a, i)))).join(' ');
    const line = k => pts.map(p => P(p.i, p[k])).join(' ');
    const ticks = [lo + pad, (lo + hi) / 2, hi - pad];
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Paper account value since ${fmtDate(START)}, with the range expected from the rule's out-of-sample test, and holding BTC">
      ${B ? `<polygon points="${area('p5', 'p95')}" fill="var(--accent)" opacity=".08"/>
        <polygon points="${area('p25', 'p75')}" fill="var(--accent)" opacity=".14"/>
        <polyline points="${idx.map(i => P(i, D.bankroll * (1 + bandAt('p50', i)))).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 4" opacity=".7"/>` : ''}
      ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" opacity=".7"/>
        <text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${usd0(t)}</text>`).join('')}
      <line x1="${pl}" x2="${W - pr}" y1="${y(D.bankroll)}" y2="${y(D.bankroll)}" stroke="var(--muted)" stroke-dasharray="3 4" opacity=".6"/>
      ${pts.length > 1 ? `<polyline points="${line('b')}" fill="none" stroke="var(--btc)" stroke-width="2"/>
        <polyline points="${line('e')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>` : ''}
      <circle cx="${x(pts[pts.length - 1].i)}" cy="${y(pts[pts.length - 1].e)}" r="4" fill="var(--accent)"/>
      <text x="${pl}" y="${H - 8}" font-size="11" fill="var(--muted)">${fmtDate(START)}</text>
      <text x="${W - pr}" y="${H - 8}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtDate(addDays(START, end))}</text>
    </svg>`;
  }
  function track(){
    if (!B) return '';
    if (!nDays) return 'Once daily results start, this line says whether the account is inside the range its test suggests.';
    const r = official / D.bankroll - 1, q = k => bandAt(k, nDays);
    const where = r < q('p5') ? 'below the expected range: worse than 95% of simulated paths'
      : r < q('p25') ? 'in the lower part of the expected range'
      : r <= q('p75') ? 'in the middle of the expected range'
      : r <= q('p95') ? 'in the upper part of the expected range'
      : 'above the expected range: better than 95% of simulated paths';
    return `After ${nDays} day${nDays > 1 ? 's' : ''}, the account (${pct(r, 1)}) is <b>${where}</b>.`;
  }
  // stale-data warning: the latest complete daily candle should be yesterday's (UTC), allow a day's slack
  const todayUTC = new Date().toISOString().slice(0, 10);
  const behindDays = D.status.data_through ? Math.round((Date.parse(todayUTC) - Date.parse(D.status.data_through)) / 86400000) - 1 : 0;
  // tamper-evidence for this week (lab/proof.py)
  const raw = f => `https://raw.githubusercontent.com/paulfryy/glass-box/main/lab/proofs/${f}`;
  const proofOf = w => (D.proofs || []).find(p => p.week === w);
  const proofBadge = w => { const p = proofOf(w); if (!p) return 'Bitcoin timestamp: being created';
    return p.bitcoin_block ? `<a href="${raw(w + '.csv.ots')}">Anchored in Bitcoin block ${Number(p.bitcoin_block).toLocaleString('en-US')}</a> ✓`
      : 'Bitcoin timestamp pending (usually a few hours)'; };

  // ---- live pieces (re-rendered every minute)
  function hero(){
    const v = live ? liveValue() : official, r = v / D.bankroll - 1;
    return `<div class="label">${live ? 'Right now · live estimate' : 'At the last daily close'}</div>
      <div class="big mono">${usd(v)}</div>
      <div class="delta ${cls(r)}">${pct(r, 2)} since ${fmtDate(START)}</div>
      <div class="s">${live ? `Updated ${esc(localTime(live.asOf * 1000))}. Refreshes every minute.` : 'Live prices loading…'}
        Official value at the ${esc(D.status.data_through ? fmtDate(D.status.data_through) : '')} daily close: ${usd(official)}.</div>`;
  }
  function movers(){
    if (!D.book.length) return '';
    const m = D.book.map(p => ({coin: p.coin, v: pnlWeek(p)})).sort((a, b) => Math.abs(b.v) - Math.abs(a.v)).slice(0, 4);
    const tot = D.book.reduce((s, p) => s + pnlWeek(p), 0);
    return `<span class="label">This week so far</span> <b class="mono ${cls(tot)}">${sgn$(tot)}</b>
      <span class="label" style="margin-left:8px">Biggest movers</span>
      ${m.map(x => `<span class="mover">${coinLink(x.coin)} <span class="mono ${cls(x.v)}">${sgn$(x.v)}</span></span>`).join('')}
      ${bridge(tot)}`;
  }
  // connects the positions' P&L (before costs) to the account's change this week (after costs)
  function bridge(tot){
    const h = D.history.find(x => x.week === wk);
    if (!h) return `<div class="bridge">Trading costs for this week appear after its first daily close.</div>`;
    const cost = -h.cost * weekBase, fund = h.funding * weekBase;
    const acct = (live ? liveValue() : official) - weekBase;
    return `<div class="bridge" title="The tables use Monday's sizes all week; the account also re-sizes positions at each daily close, so the parts can differ from the total by a few dollars.">
      <span>Positions <b class="mono ${cls(tot)}">${sgn$(tot)}</b></span><span>·</span>
      <span>Trading costs <b class="mono ${cls(cost)}">${sgn$(cost)}</b></span><span>·</span>
      <span>Funding <b class="mono ${cls(fund)}">${sgn$(fund)}</b></span><span>=</span>
      <span>Account this week <b class="mono ${cls(acct)}">${sgn$(acct)}</b>${live ? ' (live)' : ''}</span></div>`;
  }
  function side(which){
    const rows = D.book.filter(p => p.side === which).sort((a, b) => Math.abs(b.weight) - Math.abs(a.weight));
    if (!rows.length) return '<p class="empty">None this week.</p>';
    return `<div class="tbl"><table><thead><tr><th>Coin</th><th class="r">Size</th><th class="r hide-sm">Entry</th><th class="r hide-sm">Now</th><th class="r">Price move</th><th class="r">P&amp;L</th></tr></thead><tbody>
      ${rows.map(p => { const m = mark(p); const mv = m.px == null ? null : m.px / p.entry - 1; const v = pnlWeek(p);
        return `<tr><td>${coinLink(p.coin)}</td><td class="num">${usd0(Math.abs(p.weight) * weekBase)}</td>
          <td class="num hide-sm">${price(p.entry)}</td>
          <td class="num hide-sm" title="${m.live ? 'Live price' : 'Last daily close (no live source for this coin)'}">${price(m.px)}${m.live || !live ? '' : '<sup>*</sup>'}</td>
          <td class="num">${mv == null ? '–' : pct(mv)}</td><td class="num pl ${cls(v)}">${mv == null ? '–' : sgn$(v)}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  }
  function liveNote(){
    const missing = live ? D.book.filter(p => !mark(p).live).length : 0;
    return `Entry is the Monday daily close (00:00 UTC). Price move and P&amp;L run from that close to ${live ? 'the live price' : 'the latest daily close'}, before costs.
      Live prices are indicative: they come from Gate.io, MEXC and OKX futures, because Binance's live feed isn't available in the US. The official account uses Binance daily closes.
      ${missing ? `<sup>*</sup>${missing} coin${missing > 1 ? 's' : ''} without a live source show the last close.` : ''}
      This week's positions add up to ${usd0(gross * weekBase)}, half long and half short. That's usually less than the full account because a coin can be long in one of the rule's four rankings and short in another, and those cancel out.`;
  }
  // one side's running P&L this week (before costs), for the table headers
  function sideSum(which){
    const rows = D.book.filter(p => p.side === which);
    if (!rows.length) return '';
    const v = rows.reduce((s, p) => s + pnlWeek(p), 0);
    const size = rows.reduce((s, p) => s + Math.abs(p.weight) * weekBase, 0);
    return `<b class="mono ${cls(v)}">${sgn$(v)}</b> <span class="muted">${size ? pct(v / size, 1) : ''} on ${usd0(size)}</span>`;
  }
  function renderLive(){
    const set = (id, h) => { const e = document.getElementById(id); if (e) e.innerHTML = h; };
    set('hero', hero()); set('movers', movers()); set('bookLong', side('long')); set('bookShort', side('short')); set('liveNote', liveNote());
    set('sumLong', sideSum('long')); set('sumShort', sideSum('short'));
  }
  async function loadLive(){
    try {
      const r = await fetch('https://api.glassbox.gripe/prices', {cache: 'no-store'});
      const j = await r.json();
      if (j.ok) { live = j; renderLive(); }
    } catch (e) { /* keep showing daily closes */ }
  }

  const hist = D.history.slice().reverse();
  const nWeeks = D.weeks.length;
  const cps = D.review_weeks.map(n => ({n, d: addDays(START, 7 * n)}));
  const upd = D.status.updated_utc ? localTime(utcStamp(D.status.updated_utc)) : '–';

  document.getElementById('lab').innerHTML = `
  ${behindDays >= 2 ? `<div class="stale" role="status"><b>Official data is delayed.</b> The latest daily close we have is ${fmtDate(D.status.data_through)}, ${behindDays} days behind. The daily update may have failed; it will catch up automatically once it runs. Live prices below are unaffected.</div>` : ''}
  <section class="intro">
    <div class="label">Strategy lab · candidate · public research log</div>
    <h1>Can a simple momentum rule beat memecoins?</h1>
    <p>We're testing one trading rule in public with a ${bank} paper account (no real money). Each week it bets on the memecoins that have been rising and against the ones that have been falling. Every week's positions are <a href="${D.repo}/commits/main/lab/positions.csv" target="_blank" rel="noopener">published to GitHub</a> and stamped into Bitcoin early in the week, and losing weeks stay up.</p>
  </section>

  <section class="panel" aria-label="Paper account">
    <div class="hero-grid">
      <div class="hero" id="hero" aria-live="polite">${hero()}</div>
      <div class="stats">
        <div class="stat"><div class="label">Holding BTC instead</div><div class="v">${usd(last ? last.b : D.bankroll)}</div><div class="s ${cls(btcRet)}">${last ? pct(btcRet, 2) + ' at the daily close' : 'from the next daily close'}</div></div>
        <div class="stat"><div class="label">Worst drop</div><div class="v">${dd < 0 ? pct(dd, 1) : '0%'}</div><div class="s">from a previous high</div></div>
        <div class="stat"><div class="label">Weeks live</div><div class="v">${nWeeks}</div><div class="s">of ${D.review_weeks[1]} planned</div></div>
      </div>
    </div>
    <div class="chart">${chart()}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Momentum rule (after costs)</span><span><i style="background:var(--btc)"></i>Buy and hold BTC</span>
      ${B ? `<span><i class="swatch"></i>Expected range if it performs like its Apr–Sep 2026 test (middle half darker, 90% lighter)</span>` : ''}</div>
    ${B ? `<p class="track">${track()}</p>` : ''}
    <p class="normal"><b>What's normal:</b> in the backtest, a typical day moved the account about ±1.4% and a typical week about ±4%. Half of all weeks lost money. Even if the rule is as good as its test, the shaded range after 26 weeks runs from about −36% to +129%, and roughly 3 in 10 simulated paths are still down. A single day or week tells you very little, so judge it at the checkpoints below.</p>
  </section>

  <section style="display:grid;gap:12px" aria-label="This week's positions">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <h2>This week's positions${wk ? ' · week of ' + fmtDate(wk) : ''}</h2>
      ${D.book.length ? `<span class="muted" style="font-size:13px">Published ${esc(localTime(utcStamp(D.book[0].published)))} · ${proofBadge(wk)} · <a href="#proof">how to check</a></span>` : ''}
    </div>
    ${D.book.length ? `<div class="movers" id="movers" aria-live="polite">${movers()}</div>` : ''}
    <div class="book">
      <div class="panel"><div class="sidehead"><h3><span class="side long">${term('Long', TIP.long)}</span> · bets these keep rising</h3><span class="sidesum" id="sumLong">${sideSum('long')}</span></div><div id="bookLong">${side('long')}</div></div>
      <div class="panel"><div class="sidehead"><h3><span class="side short">${term('Short', TIP.short)}</span> · bets these keep falling</h3><span class="sidesum" id="sumShort">${sideSum('short')}</span></div><div id="bookShort">${side('short')}</div></div>
    </div>
    <p class="muted" style="font-size:13px;margin:0" id="liveNote">${liveNote()}</p>
    <dl class="glossary">
      <div><dt>Long</dt><dd>A bet that the price rises. It makes money when the coin goes up.</dd></div>
      <div><dt>Short</dt><dd>A bet that the price falls. It makes money when the coin goes down, and loses when it goes up.</dd></div>
      <div><dt>Funding</dt><dd>A small fee that futures longs and shorts pay each other every few hours. It can add to or take from the result.</dd></div>
      <div><dt>Paper account</dt><dd>Pretend money. Every trade is recorded as if it happened, with realistic costs, but nothing is really bought.</dd></div>
    </dl>
  </section>

  <section aria-label="What we know so far" style="display:grid;gap:12px">
    <h2>What we know so far</h2>
    <div class="evidence">
      <div class="ev"><span class="pill pass">Passed</span><h3>Six-month test on memecoins</h3>
        <p>Rule frozen first, then tested on Apr–Sep 2026 data it had never seen: <b>+30% after costs</b>, not tied to the market's direction. But six months is short: we put only about a <b>75% chance</b> on it being more than luck.</p></div>
      <div class="ev"><span class="pill fail">Failed</span><h3>Same rule on 659 other crypto coins</h3>
        <p>Pre-registered test on 2021–2026: it <b>lost 13% in the 2022 bear market</b>. Without a few rare ${term('funding', TIP.funding)} windfalls it lost 37% overall: the price signal didn't beat trading costs.</p></div>
      <div class="ev"><span class="pill note">Our expectation</span><h3>More likely luck than edge</h3>
        <p>The memecoin result may be specific to that sample. This page is how we find out: live, week by week, with nothing hidden.</p></div>
    </div>
  </section>

  <section class="panel" aria-label="Weekly results">
    <h2>Week by week</h2>
    ${hist.length ? `<div class="tbl"><table><thead><tr><th>Week of</th><th class="r">Rule, after costs</th><th class="r hide-sm">Trading costs</th><th class="r hide-sm">Funding</th><th class="r">BTC</th></tr></thead><tbody>
      ${hist.map(h => `<tr><td>${fmtDate(h.week)}${h.days < 7 ? ' <span class="muted">(so far)</span>' : ''}</td><td class="num ${cls(h.ret)}">${pct(h.ret, 2)}</td>
        <td class="num hide-sm">${pct(-h.cost, 2)}</td><td class="num hide-sm">${pct(h.funding, 2)}</td><td class="num ${cls(h.btc)}">${pct(h.btc, 2)}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="empty">The first week is in progress. Official results appear after each daily close (00:00 UTC).</p>'}
    <p class="muted" style="font-size:13px;margin:0">Official numbers use Binance daily closes. ${term('Funding', TIP.funding)} is published by Binance once a month, so each month's funding is added when it appears (included through ${esc(D.status.funding_through ? fmtDate(D.status.funding_through) : '–')}) and recent weeks may shift slightly.</p>
  </section>

  <section style="display:grid;gap:12px" aria-label="Checkpoints">
    <h2>When we'll judge it</h2>
    <div class="checkpoints">
      <div class="cp"><span class="when">Week ${cps[0].n} · ${fmtDate(cps[0].d)}</span><span>First write-up here, win or lose. Too early to conclude anything, but big surprises either way will show.</span></div>
      <div class="cp"><span class="when">Week ${cps[1].n} · ${fmtDate(cps[1].d)}</span><span>Main checkpoint. We'll only call the rule "still alive" if the paper account is up after costs. Given the failed altcoin test, even that would be modest evidence.</span></div>
    </div>
  </section>

  <details class="how" id="proof">
    <summary>Proof: check we didn't change anything afterwards</summary>
    <p class="muted" style="margin:10px 0 0;font-size:14px;max-width:80ch">Each week's positions are saved as a small file, and its fingerprint (SHA-256) is stamped into the Bitcoin blockchain through <a href="https://opentimestamps.org" target="_blank" rel="noopener">OpenTimestamps</a>, a free public service. Nobody, including us, can backdate a Bitcoin block, so the stamp proves the file existed at that time. To check a week, download its positions file and its .ots proof and drop both on <a href="https://opentimestamps.org" target="_blank" rel="noopener">opentimestamps.org</a>. It shows the Bitcoin block and time. The files are also committed by an automated GitHub job whose run log has GitHub's own timestamps.</p>
    ${(D.proofs || []).length ? `<div class="tbl" style="margin-top:10px"><table><thead><tr><th>Week of</th><th>Fingerprint (SHA-256)</th><th class="hide-sm">Stamped</th><th>Bitcoin</th><th>Files</th></tr></thead><tbody>
      ${D.proofs.slice().reverse().map(p => `<tr><td>${fmtDate(p.week)}</td><td class="mono" style="font-size:12px" title="${esc(p.sha256)}">${esc(p.sha256.slice(0, 16))}…</td>
        <td class="hide-sm">${esc(localTime(utcStamp(p.stamped_utc)))}</td>
        <td>${p.bitcoin_block ? 'block ' + Number(p.bitcoin_block).toLocaleString('en-US') + ' ✓' : 'pending'}</td>

    </tbody></table></div>
    <p class="muted" style="font-size:13px;margin:8px 0 0">Week 1 (Sep 28) was published by hand at the start of the experiment, so it has no automated run log. Its positions were committed at 12:39 UTC on Sep 29 and Bitcoin-stamped at 16:38 UTC, about 13 and 17 hours into the week. From week 2 on, publishing, stamping and committing happen in one automated run about 9 hours after the Monday close: that's when Binance releases the day's data (around 08:20 UTC). The positions depend only on prices up to the Monday close, so they can't use anything that happened later, and the stamp shows they weren't changed afterwards.</p>` : ''}
  </details>

  <details class="how">
    <summary>Exactly how the rule works</summary>
    <ul>
      <li><b>Coins:</b> a fixed list of 53 memecoin perpetual futures on Binance, frozen with the rule on Sep 27, 2026 (<a href="${D.repo}/blob/main/lab/universe.yaml" target="_blank" rel="noopener">list</a>). Each week, only coins with 14+ days of history and a typical daily volume of at least $2 million count.</li>
      <li><b>Signal:</b> rank those coins by their return over the last 14 days, and separately over the last 30 days. For each, go long the top 3 and short the bottom 3, and separately the top 5 and bottom 5. The four rankings are averaged, so a coin picked by all four gets the biggest position.</li>
      <li><b>Timing:</b> the coins are re-picked at each Monday daily close (00:00 UTC Tuesday), and only the difference from last week is traded. In between, each position is brought back to its target share of the account at every daily close (a winner that has grown is trimmed, for example), and a coin that stops qualifying mid-week is closed. Every trade, weekly or daily, pays the costs below.</li>
      <li><b>Costs:</b> 0.10% fee plus 0.15% slippage on every dollar traded, plus actual funding. No leverage beyond the positions shown.</li>
      <li><b>Data:</b> Binance's free public archive, <a href="https://data.binance.vision" target="_blank" rel="noopener">data.binance.vision</a>. <a href="${D.repo}/blob/main/lab/m1.py" target="_blank" rel="noopener">The code</a> and every daily number (<a href="${D.repo}/blob/main/lab/equity.csv" target="_blank" rel="noopener">equity.csv</a>) are public.</li>
      <li><b>Nothing gets re-tuned.</b> If the rule does badly, it stays up and does badly here.</li>
    </ul>
  </details>
