<title>Controls · Strategy Lab</title>
<meta name="description" content="What a typical memecoin buyer would do, tracked live with paper money: owning every memecoin, and buying only the recent winners.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
__CSS__
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card .big{font-size:clamp(28px,5vw,38px);font-weight:500;line-height:1.05;font-variant-numeric:tabular-nums}
.card .row{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px}
.card .bt{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
details.hold summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:16px}
@media (max-width:760px){.cards{grid-template-columns:1fr}}
</style>

<div class="wrap" style="padding-block:18px 0">
  <nav class="tabs" aria-label="Sections">
    <a href="/">This coin</a>
    <a href="/#check">Check any coin</a>
    <a href="/lab/" aria-current="page">Strategy lab</a>
  </nav>
  <nav class="subnav" aria-label="Strategy lab pages">
    <a href="/lab/">Overview</a>
    <a href="/lab/momentum/">Momentum (M1)</a>
    <a href="/lab/controls/" aria-current="page">Controls</a>
  </nav>
</div>
<div class="wrap" id="lab"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const pct = (x, d=1) => (x >= 0 ? '+' : '−') + Math.abs(x * 100).toFixed(d) + '%';
  const cls = x => x > 0 ? 'up' : (x < 0 ? 'down' : '');
  const usd = x => '$' + x.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const usd0 = x => '$' + Math.round(x).toLocaleString('en-US');
  const sgn$ = x => (Math.round(x) >= 0 ? '+' : '−') + '$' + Math.abs(Math.round(x)).toLocaleString('en-US');
  const price = x => x == null ? '–' : (x >= 1 ? x.toFixed(3) : x.toPrecision(4));
  const fmtDate = s => new Date(s + 'T00:00:00Z').toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC'});
  const localTime = ms => { const d = new Date(ms);
    return `${d.toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short'})} (${d.toISOString().slice(11, 16)} UTC)`; };
  const coinLink = c => `<a class="coin" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent('BINANCE:' + c + 'USDT.P')}" target="_blank" rel="noopener" title="Chart of the Binance ${esc(c)} perpetual on TradingView">${esc(c)}</a>`;
  const START = '2026-09-28';
  const COLOR = {basket: 'var(--muted)', longonly: 'var(--warn)'};

  // live marks (indicative), same source as the momentum page
  let live = null;
  const mark = p => { const lp = live && live.prices[p.coin + 'USDT']; return lp ? {px: lp, live: true} : {px: p.now, live: false}; };
  const weekBase = c => { const wk = c.weeks[c.weeks.length - 1]; return !wk || wk === START ? D.bankroll : ((c.equity.find(r => r.d === wk) || {}).e || c.value); };
  const pnl = (c, p) => { const m = mark(p); return m.px == null ? 0 : p.weight * weekBase(c) * (m.px / p.entry - 1); };
  const liveValue = c => c.value * (1 + c.book.reduce((s, p) => { const m = mark(p); return s + (m.px == null || p.now == null ? 0 : p.weight * (m.px / p.now - 1)); }, 0));

  function card(c){
    const v = live ? liveValue(c) : c.value, r = v / D.bankroll - 1;
    return `<div class="label">${live ? 'Right now · live estimate' : 'At the last daily close'}</div>
      <div class="big mono">${usd(v)}</div>
      <div class="row"><span class="mono ${cls(r)}"><b>${pct(r, 2)}</b> since ${fmtDate(START)}</span><span class="muted">Worst drop ${c.worst < 0 ? pct(c.worst, 1) : '0%'}</span>
        <span class="muted">Official: ${usd(c.value)}</span></div>`;
  }
  function holdings(c){
    if (!c.book.length) return '<p class="empty">No positions yet.</p>';
    const rows = c.book.slice().sort((a, b) => pnl(c, b) - pnl(c, a));
    return `<div class="tbl"><table><thead><tr><th>Coin</th><th class="r">Size</th><th class="r hide-sm">Entry</th><th class="r">Price move</th><th class="r">P&amp;L</th></tr></thead><tbody>
      ${rows.map(p => { const m = mark(p); const mv = m.px == null ? null : m.px / p.entry - 1; const v = pnl(c, p);
        return `<tr><td>${coinLink(p.coin)}${m.live || !live ? '' : '<sup>*</sup>'}</td><td class="num">${usd0(p.weight * weekBase(c))}</td><td class="num hide-sm">${price(p.entry)}</td>
          <td class="num">${mv == null ? '–' : pct(mv)}</td><td class="num pl ${cls(v)}">${mv == null ? '–' : sgn$(v)}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  }
  function chart(){
    const n = D.m1.length;
    if (n < 2) return `<p class="empty">The comparison chart starts after the second daily close.</p>`;
    const series = [{name: 'Momentum rule (M1)', color: 'var(--accent)', w: 2.5, pts: [D.bankroll, ...D.m1.map(p => p.e)]},
      ...D.controls.map(c => ({name: c.name, color: COLOR[c.id], w: 2, dash: c.id === 'basket' ? '6 4' : '', pts: [D.bankroll, ...c.equity.map(p => p.e)]})),
      {name: 'Buy and hold BTC', color: 'var(--btc)', w: 1.8, pts: [D.bankroll, ...D.m1.map(p => p.b)]}];
    const W = 800, H = 240, pl = 60, pr = 12, pt = 12, pb = 28;
    const vals = series.flatMap(s => s.pts);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo) * 0.08 || 20; lo -= pad; hi += pad;
    const x = i => pl + i * (W - pl - pr) / n, y = v => pt + (hi - v) * (H - pt - pb) / (hi - lo);
    const ticks = [lo + pad, (lo + hi) / 2, hi - pad];
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Controls compared with the momentum rule and BTC">
      ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" opacity=".7"/>
        <text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${usd0(t)}</text>`).join('')}
      ${series.map(s => `<polyline points="${s.pts.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.w}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/>`).join('')}
    </svg><div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
  }
  function renderLive(){
    for (const c of D.controls) {
      const a = document.getElementById('card-' + c.id); if (a) a.innerHTML = card(c);
      const h = document.getElementById('hold-' + c.id); if (h) h.innerHTML = holdings(c);
      const s = document.getElementById('sum-' + c.id); if (s) s.textContent = sgn$(c.book.reduce((t, p) => t + pnl(c, p), 0));
    }
    const t = document.getElementById('liveTime'); if (t && live) t.textContent = `Live prices ${localTime(live.asOf * 1000)}, indicative (Gate.io, MEXC and OKX futures).`;
  }
  async function loadLive(){
    try { const j = await (await fetch('https://api.glassbox.gripe/prices', {cache: 'no-store'})).json(); if (j.ok) { live = j; renderLive(); } } catch (e) {}
  }

  document.getElementById('lab').innerHTML = `
  <section class="intro">
    <div class="label">Strategy lab · controls</div>
    <h1>What a typical memecoin buyer would do</h1>
    <p>These two accounts aren't strategies we expect to win. They're here so the momentum rule has something honest to be compared with: if it can't beat simply owning memecoins, its picking isn't adding anything. Both started with ${usd0(D.bankroll)} on ${fmtDate(START)}, on the same coins and prices, and pay spot-trading costs (0.40% fee plus 0.30% slippage on every dollar traded).</p>
    <p class="muted" style="font-size:13px">These controls were added on Sep 30, so their first week was filled in afterwards from the Sep 28 close. Their rules are mechanical (no choices to make with hindsight), and from week 2 on they're published at the same time as the momentum rule.</p>
  </section>

  <div class="cards">
    ${D.controls.map(c => `<section class="panel card" aria-label="${esc(c.name)}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h2>${esc(c.name)}</h2><span class="kind control">control</span></div>
      <p class="muted" style="margin:0;font-size:14px">${esc(c.what)}</p>
      <div id="card-${c.id}" style="display:grid;gap:6px" aria-live="polite">${card(c)}</div>
      <div class="bt">${esc(c.backtest)}</div>
    </section>`).join('')}
  </div>

  <section class="panel" aria-label="Comparison">
    <h2>Side by side</h2>
    <div class="chart">${chart()}</div>
    <p class="normal"><b>What to look for:</b> the momentum rule is meant to make money whether memecoins rise or fall. If memecoins crash, both controls should fall hard while M1 holds up. If M1 only tracks "just buy memecoins", its shorts aren't earning their keep.</p>
  </section>

  <section style="display:grid;gap:12px" aria-label="This week's holdings">
    <h2>This week's holdings</h2>
    <p class="muted" style="margin:0;font-size:13px" id="liveTime">Prices from the last daily close; live prices loading…</p>
    ${D.controls.map(c => `<details class="hold panel" ${c.id === 'longonly' ? 'open' : ''}>
      <summary>${esc(c.name)} · ${c.book.length} coins · this week <span class="mono" id="sum-${c.id}">–</span></summary>
      <div id="hold-${c.id}" style="margin-top:10px">${holdings(c)}</div></details>`).join('')}
    <p class="muted" style="margin:0;font-size:13px">Entry is the Monday daily close. P&amp;L is before costs.<sup>*</sup> marks a coin without a live price (last daily close shown). Positions are re-set each Monday and brought back to their target share at every daily close, the same way as the momentum rule.</p>
  </section>

  <footer class="foot">
    <div><b>Not financial advice.</b> A research log with no real money. Nothing here is connected to the Glass Box coin.</div>
    <div>Official numbers use Binance daily closes, updated around 09:20 UTC. <a href="${D.repo}/tree/main/lab/controls" target="_blank" rel="noopener">Positions and daily numbers are public.</a></div>
  </footer>`;
  renderLive();
  loadLive(); setInterval(loadLive, 60000);
})();
</script>
