<title>Strategy Lab · Glass Box</title>
<meta name="description" content="Trading strategies tested in public with paper money: every position published and Bitcoin-timestamped, losing weeks included.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
__CSS__
.board td a{font-weight:600}
.board .what{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.board td{vertical-align:top}
.coverage{display:block;font-size:.875rem;white-space:nowrap}
.provisional{display:block;color:var(--muted);font-size:.875rem;margin-top:4px}
.chart{position:relative}
.chart svg{touch-action:pan-y}
.chart-picker{border:0;margin:0;padding:0;min-width:0}
.chart-picker legend{font-weight:600;margin-bottom:4px}
.chart-picker .legend{gap:4px 16px;margin:0}
.chart-picker label{display:flex;align-items:center;gap:6px;min-height:32px;cursor:pointer}
.chart-picker input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.chart-actions{display:flex;gap:8px;margin:4px 0 6px}
.chart-actions button{font:inherit;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
.tip{position:absolute;z-index:2;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:grid;gap:4px;min-width:250px}
.tip[hidden]{display:none}
.tip-date{font-weight:600;color:var(--ink);margin-bottom:2px}
.tip-row{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}
.tip-row i{width:10px;height:3px;border-radius:2px}
.tip-row b{font-weight:500}
</style>

<div class="wrap" style="padding-block:18px 0">
  <nav class="subnav" aria-label="Strategy lab pages">
    <a href="/" aria-current="page">Overview</a>
    <a href="/momentum/">Momentum (M1)</a>
    <a href="/m1-exposure/">M1 Exposure</a>
    <a href="/carry/">Carry</a>
    <a href="/seesaw/">Seesaw</a>
    <a href="/controls/">Controls</a>
  </nav>
</div>
<div class="wrap" id="lab"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  const pct = (x, d=1) => (x >= 0 ? '+' : '−') + Math.abs(x * 100).toFixed(d) + '%';
  const cls = x => x > 0 ? 'up' : (x < 0 ? 'down' : '');
  const usd = x => '$' + x.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const usd0 = x => '$' + Math.round(x).toLocaleString('en-US');
  const fmtDate = s => new Date(s + 'T00:00:00Z').toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC'});
  const today = new Date().toISOString().slice(0, 10);
  const START = D.start;
  const STYLE = {momentum: ['var(--accent)', ''], carry: ['var(--c5)', ''], seesaw: ['var(--c6)', ''],
                 basket: ['var(--muted)', '6 4'], longonly: ['var(--warn)', ''], btc: ['var(--btc)', ''],
                 m1_full: ['var(--accent)', '6 4'], m1_half: ['var(--c5)', '3 4'], m1_volatility: ['var(--pass)', '']};

  // legend key: a short line drawn exactly like the chart's line (colour, width, dashes)
  const key = (color, w, dash) => `<svg class="key" width="26" height="10" aria-hidden="true"><line x1="1" y1="5" x2="25" y2="5" stroke="${color}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ''} stroke-linecap="round"/></svg>`;
  let G = null;   // chart geometry, kept for the hover crosshair
  function chart(selected){
    G = null;
    if (!selected.length) return '<p class="empty">Select an account to show its history.</p>';
    const available = selected.filter(s => s.equity.length);
    if (!available.length) return '<p class="empty">The selected accounts are waiting for their first daily close.</p>';
    const dates = [...new Set(available.flatMap(s => [s.start || START, ...s.equity.map(p => p.d)]))].sort();
    const n = dates.length - 1;
    const series = available.map(s => { const m = Object.fromEntries(s.equity.map(p => [p.d, p.e])), st = s.start || START;
      return {...s, pts: dates.map(d => d === st ? D.bankroll : (d > st && m[d] != null ? m[d] : null))}; });
    const W = 800, H = 260, pl = 60, pr = 12, pt = 12, pb = 28;
    const vals = series.flatMap(s => s.pts.filter(v => v != null));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo) * 0.08 || 20; lo -= pad; hi += pad;
    const x = i => pl + i * (W - pl - pr) / n;
    const y = v => pt + (hi - v) * (H - pt - pb) / (hi - lo);
    const ticks = [lo + pad, (lo + hi) / 2, hi - pad];
    G = {series, n, x, y, W, H, pl, pr, pt, pb, dates};
    return `<svg id="ovChart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Paper account values for the selected strategies. Hover or tap for values on a given day.">
      ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" opacity=".7"/>
        <text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${usd0(t)}</text>`).join('')}
      <line x1="${pl}" x2="${W - pr}" y1="${y(D.bankroll)}" y2="${y(D.bankroll)}" stroke="var(--muted)" stroke-dasharray="3 4" opacity=".6"/>
      ${series.map(s => `<polyline points="${s.pts.map((v, i) => v == null ? '' : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(' ')}" fill="none" stroke="${STYLE[s.id][0]}" stroke-width="${s.id === 'momentum' ? 2.5 : 1.8}" ${STYLE[s.id][1] ? `stroke-dasharray="${STYLE[s.id][1]}"` : ''}/>`).join('')}
      <text x="${pl}" y="${H - 8}" font-size="11" fill="var(--muted)">${fmtDate(dates[0])}</text>
      <text x="${W - pr}" y="${H - 8}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtDate(G.dates[G.dates.length - 1])}</text>
      <g id="ovHover" visibility="hidden">
        <line id="ovGuide" y1="${pt}" y2="${H - pb}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2 3"/>
        ${series.map(s => `<circle data-id="${s.id}" r="4" fill="${STYLE[s.id][0]}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
      </g>
      <rect x="${pl}" y="${pt}" width="${W - pl - pr}" height="${H - pt - pb}" fill="transparent" style="cursor:crosshair"/>
    </svg><div class="tip" id="ovTip" hidden></div>`;
  }
  // hover / tap crosshair: snap to the nearest daily close and list every strategy's value there
  function attachHover(){
    const svg = document.getElementById('ovChart'), tip = document.getElementById('ovTip');
    if (!svg || !G) return;
    const hoverG = document.getElementById('ovHover'), guide = document.getElementById('ovGuide');
    const show = e => {
      const r = svg.getBoundingClientRect();
      const vx = (e.clientX - r.left) / r.width * G.W;
      const i = Math.max(0, Math.min(G.n, Math.round((vx - G.pl) / (G.W - G.pl - G.pr) * G.n)));
      const xi = G.x(i);
      guide.setAttribute('x1', xi); guide.setAttribute('x2', xi);
      hoverG.querySelectorAll('circle').forEach(c => { const s = G.series.find(z => z.id === c.dataset.id);
        const v = s.pts[i]; c.setAttribute('visibility', v == null ? 'hidden' : 'visible');
        if (v != null) { c.setAttribute('cx', xi); c.setAttribute('cy', G.y(v)); } });
      hoverG.setAttribute('visibility', 'visible');
      const rows = G.series.map(s => ({s, v: s.pts[i]})).filter(r => r.v != null).sort((a, b) => b.v - a.v);
      tip.innerHTML = `<div class="tip-date">${i === 0 ? 'Start · ' : ''}${fmtDate(G.dates[i])} close (UTC)</div>` +
        rows.map(({s, v}) => `<div class="tip-row"><i style="background:${STYLE[s.id][0]}"></i><span>${esc(s.name)}</span>
          <b class="mono">${usd(v)}</b><span class="mono ${cls(v / D.bankroll - 1)}">${pct(v / D.bankroll - 1, 1)}</span></div>`).join('');
      tip.hidden = false;
      const box = svg.parentElement.getBoundingClientRect(), px = xi / G.W * r.width + (r.left - box.left);
      const left = px + 14 + tip.offsetWidth > box.width ? px - 14 - tip.offsetWidth : px + 14;
      tip.style.left = Math.max(0, left) + 'px';
      tip.style.top = Math.max(0, (e.clientY - box.top) - tip.offsetHeight / 2) + 'px';
    };
    const hide = () => { hoverG.setAttribute('visibility', 'hidden'); tip.hidden = true; };
    svg.addEventListener('pointermove', show);
    svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointerleave', hide);
  }

  function checkpoint(s) {
    if (!s.checkpoints) return '—';
    const next = s.checkpoints.find(d => d >= today);
    return next ? `Week ${next === s.checkpoints[0] ? 13 : 26} · ${fmtDate(next)}`
      : `Week 26 review · ${fmtDate(s.checkpoints[1])}`;
  }
  function coverage(s) {
    const st = s.status;
    const priced = st.data_through ? fmtDate(st.data_through) : 'Pending';
    const updated = st.updated_utc ? `${st.updated_utc} UTC` : 'Pending';
    const funded = st.funding_through && st.funding_through !== '-' ? fmtDate(st.funding_through) : 'Pending';
    const missing = Number(st.funding_missing_contract_days);
    const provisional = !Number.isFinite(missing) || missing > 0;
    const delayed = st.data_through && Date.parse(today) - Date.parse(st.data_through) > 2 * 86400000;
    return `<span class="coverage">Prices through ${priced}<br>
      Funding through ${funded}<br>Updated ${esc(updated)}</span>
      ${delayed ? '<span class="provisional">Price update delayed</span>' : ''}
      ${provisional ? `<span class="provisional">Provisional funding${missing > 0 ? ` · ${missing} missing contract-days` : ''}</span>` : ''}`;
  }
  function metrics(s) {
    return `<td class="num ${cls(s.ret)}">${s.equity.length ? pct(s.ret, 2) : '—'}
      <span class="what">${s.equity.length ? 'Since' : s.start > today ? 'Scheduled' : 'Starts'} ${fmtDate(s.start || START)}</span></td>
      <td class="num">${s.equity.length ? pct(s.worst, 1) : '—'}</td>`;
  }
  const candidates = D.board.filter(s => s.kind === 'candidate');
  const comparisons = D.board.filter(s => s.kind !== 'candidate');
  document.getElementById('lab').innerHTML = `
  <section class="intro">
    <h1>Strategy Lab</h1>
    <p>Trading rules tested in public with ${usd0(D.bankroll)} paper accounts. Follow the daily results, published positions, and review criteria.</p>
  </section>
  <section class="panel" aria-label="Forward tests">
    <h2>Forward tests</h2>
    <div class="tbl"><table class="board"><thead><tr><th scope="col">Strategy</th><th scope="col" class="r">Net return</th><th scope="col" class="r">Max drawdown</th>
      <th scope="col">Checkpoint</th><th scope="col">Data coverage</th></tr></thead><tbody>
      ${candidates.map(s => `<tr><td><a href="${s.href}">${esc(s.name)}</a><span class="what">${esc(s.what)}</span></td>
        ${metrics(s)}<td><b>${checkpoint(s)}</b><span class="what">${esc(s.bar)}</span></td><td>${coverage(s)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="normal">Provisional results omit funding for missing contract-days. Equity updates when those funding records arrive.</p>
  </section>
  <section class="panel" id="comparison" aria-label="Daily account history">
    <h2>Daily account history</h2>
    <fieldset class="chart-picker">
      <legend>Compare accounts</legend>
      <div class="chart-actions"><button type="button" id="chartAll">Select all</button><button type="button" id="chartClear">Clear selection</button></div>
      <div class="legend">${D.board.map(s => `<label><input type="checkbox" value="${s.id}" checked>${key(STYLE[s.id][0], s.id === 'momentum' ? 2.5 : 1.8, STYLE[s.id][1])}${esc(s.name)}</label>`).join('')}</div>
    </fieldset>
    <div class="chart" id="chartView" aria-live="polite"></div>
  </section>
  <section class="panel" aria-label="Comparison accounts">
    <h2>Comparison accounts</h2>
    <div class="tbl"><table class="board"><thead><tr><th scope="col">Account</th><th scope="col" class="r">Net return</th><th scope="col" class="r">Max drawdown</th></tr></thead><tbody>
      ${comparisons.map(s => `<tr><td>${s.href ? `<a href="${s.href}">${esc(s.name)}</a>` : `<b>${esc(s.name)}</b>`}<span class="what">${esc(s.what)}</span></td>${metrics(s)}</tr>`).join('')}
    </tbody></table></div>
  </section>
  <footer class="foot">
    <div>Paper results use Binance archive data. <a href="${D.repo}/tree/main/lab">Browse the lab code, positions, and proof files.</a></div>
    <div><a href="${D.repo}/blob/main/lab/forward_protocol.md">Read the carry and Seesaw protocol.</a></div>
  </footer>`;
  const options = [...document.querySelectorAll('.chart-picker input[type="checkbox"]')];
  function drawComparison(){
    const selected = new Set(options.filter(option => option.checked).map(option => option.value));
    document.getElementById('chartView').innerHTML = chart(D.board.filter(s => selected.has(s.id)));
    attachHover();
  }
  function selectAccounts(checked){
    options.forEach(option => { option.checked = checked; });
    drawComparison();
  }
  options.forEach(option => option.addEventListener('change', drawComparison));
  document.getElementById('chartAll').addEventListener('click', () => selectAccounts(true));
  document.getElementById('chartClear').addEventListener('click', () => selectAccounts(false));
  drawComparison();
})();
</script>
